name: Check Xinetic Scripts

on:
  push:
    branches: [main]
    paths:
      - "system/scripts/**"
      - ".github/workflows/check-scripts.yml"

  pull_request:
    branches: [main]

jobs:
  shellcheck:
    name: Validate shell scripts
    runs-on: ubuntu-latest

    steps:
      - name: Get source code
        uses: actions/checkout@v4

      - name: Install ShellCheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck

      - name: Check scripts
        run: |
          find system/scripts -type f -name "*.sh" -print0 |
          xargs -0 -r shellcheck -e SC1091
